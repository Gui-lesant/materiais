<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <style>

<body>
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <p>Carregando dados...</p>
    </div>

    <div class="container" id="main-content">
        <!-- SEU HTML EXISTENTE AQUI - NÃO ALTERADO -->
        <header>

                <div class="logo-container">
                    <i class="fas fa-hand-holding-medical logo"></i>
                    <div class="header-text">

        <div class="dashboard">
            <!-- ... RESTANTE DO SEU HTML EXISTENTE ... -->

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCFeYDNbXWNXSBPedaOXfSnDmlLh8Xtn9I",
            authDomain: "materiais-aeb0e.firebaseapp.com",
            projectId: "materiais-aeb0e",
            storageBucket: "materiais-aeb0e.firebasestorage.app",
            messagingSenderId: "78482972694",
            appId: "1:78482972694:web:659039bd4f6ba8689e1537",
            measurementId: "G-70BPGLZ63L"
        };

        // Inicialização do Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Estrutura de dados principal
        let appData = {
            unidades: [],
            meses: {},
            currentMonth: new Date().toISOString().slice(0, 7),
            lastUpdate: new Date().toISOString(),
            isAdmin: false
        };

        // ========== FUNÇÕES DO FIRESTORE ==========

        // Salvar dados no Firestore
        async function saveToFirestore() {
            try {
                appData.lastUpdate = new Date().toISOString();
                await db.collection('sistemaLimpeza').doc('dadosPrincipais').set({
                    ...appData,
                    firestoreUpdate: new Date().toISOString()
                });
                console.log('Dados salvos no Firestore com sucesso');
                return true;
            } catch (error) {
                console.error('Erro ao salvar no Firestore:', error);
                return false;
            }
        }

        // Carregar dados do Firestore
        async function loadFromFirestore() {
            try {
                const doc = await db.collection('sistemaLimpeza').doc('dadosPrincipais').get();
                if (doc.exists) {
                    const firestoreData = doc.data();
                    appData = { ...appData, ...firestoreData };
                    
                    // Garantir que a estrutura esteja correta
                    if (!appData.meses) appData.meses = {};
                    if (!appData.unidades) appData.unidades = [];
                    
                    appData.unidades.forEach(unidade => {
                        if (!unidade.meses) unidade.meses = {};
                    });
                    
                    console.log('Dados carregados do Firestore:', appData);
                    return true;
                } else {
                    console.log('Nenhum dado encontrado no Firestore');
                    return false;
                }
            } catch (error) {
                console.error('Erro ao carregar do Firestore:', error);
                return false;
            }
        }

        // Fazer backup completo para o Firestore
        async function backupToFirestore() {
            try {
                const backupData = {
                    unidades: appData.unidades,
                    meses: appData.meses,
                    currentMonth: appData.currentMonth,
                    lastUpdate: new Date().toISOString(),
                    backupVersion: '2.0',
                    backupTimestamp: new Date().toISOString()
                };
                
                await db.collection('backups').doc(`backup_${new Date().toISOString().replace(/[:.]/g, '-')}`).set(backupData);
                console.log('Backup criado no Firestore com sucesso');
                return true;
            } catch (error) {
                console.error('Erro ao criar backup no Firestore:', error);
                return false;
            }
        }

        // Listar backups disponíveis
        async function listBackups() {
            try {
                const snapshot = await db.collection('backups')
                    .orderBy('backupTimestamp', 'desc')
                    .limit(10)
                    .get();
                
                const backups = [];
                snapshot.forEach(doc => {
                    backups.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });
                
                return backups;
            } catch (error) {
                console.error('Erro ao listar backups:', error);
                return [];
            }
        }

        // Restaurar de um backup específico
        async function restoreFromBackup(backupId) {
            try {
                const doc = await db.collection('backups').doc(backupId).get();
                if (doc.exists) {
                    const backupData = doc.data();
                    appData = {
                        ...appData,
                        unidades: backupData.unidades || [],
                        meses: backupData.meses || {},
                        currentMonth: backupData.currentMonth || new Date().toISOString().slice(0, 7)
                    };
                    
                    await saveToFirestore();
                    console.log('Backup restaurado com sucesso');
                    return true;
                } else {
                    console.log('Backup não encontrado');
                    return false;
                }
            } catch (error) {
                console.error('Erro ao restaurar backup:', error);
                return false;
            }
        }

        // Sincronização em tempo real
        function setupRealtimeSync() {
            return db.collection('sistemaLimpeza').doc('dadosPrincipais')
                .onSnapshot((doc) => {
                    if (doc.exists) {
                        const firestoreData = doc.data();
                        // Evitar loop infinito - só atualizar se os dados forem diferentes
                        if (firestoreData.lastUpdate !== appData.lastUpdate) {
                            console.log('Dados atualizados em tempo real do Firestore');
                            appData = { ...appData, ...firestoreData };
                            updateDashboard();
                        }
                    }
                }, (error) => {
                    console.error('Erro na sincronização em tempo real:', error);
                });
        }

        // ========== FUNÇÕES EXISTENTES MODIFICADAS ==========

        // Carregar dados (agora tenta do Firestore primeiro)
        async function loadData() {
            toggleLoading(true);
            
            try {
                // Tentar carregar do Firestore
                const firestoreSuccess = await loadFromFirestore();
                
                if (!firestoreSuccess) {
                    // Se não há dados no Firestore, tentar do localStorage
                    const saved = localStorage.getItem('limpezaData');
                    if (saved) {
                        try {
                            const parsed = JSON.parse(saved);
                            appData = { ...appData, ...parsed };
                            
                            // Salvar no Firestore para sincronização futura
                            await saveToFirestore();
                        } catch (e) {
                            console.error('Erro ao carregar dados do localStorage:', e);
                        }
                    }
                }
                
                // Garantir que a estrutura de meses esteja correta
                if (!appData.meses) appData.meses = {};
                
                // Garantir que todas as unidades tenham dados para o mês atual
                appData.unidades.forEach(unidade => {
                    if (!unidade.meses) unidade.meses = {};
                    if (!unidade.meses[appData.currentMonth]) {
                        unidade.meses[appData.currentMonth] = {
                            produtos: {},
                            sugestoes: [],
                            dataImportacao: new Date().toISOString()
                        };
                    }
                });
                
                console.log('Dados carregados:', appData);
            } catch (error) {
                console.error('Erro ao carregar dados:', error);
            } finally {
                toggleLoading(false);
            }
        }

        // Salvar dados (agora salva em ambos)
        async function saveData() {
            try {
                appData.lastUpdate = new Date().toISOString();
                
                // Salvar no localStorage
                localStorage.setItem('limpezaData', JSON.stringify(appData));
                
                // Salvar no Firestore
                await saveToFirestore();
                
                console.log('Dados salvos com sucesso (local + Firestore)');
            } catch (e) {
                console.error('Erro ao salvar dados:', e);
            }
        }

        // Exportar backup (agora inclui opção Firestore)
        async function exportBackup() {
            try {
                const backupData = {
                    unidades: appData.unidades,
                    meses: appData.meses,
                    currentMonth: appData.currentMonth,
                    lastUpdate: new Date().toISOString(),
                    backupVersion: '2.0',
                    backupTimestamp: new Date().toISOString()
                };
                
                const dataStr = JSON.stringify(backupData, null, 2);
                const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
                
                const exportFileDefaultName = `backup_limpeza_${new Date().toISOString().slice(0,10)}.json`;
                
                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri);
                linkElement.setAttribute('download', exportFileDefaultName);
                linkElement.click();
                
                // Também criar backup no Firestore
                await backupToFirestore();
                
                alert('Backup exportado com sucesso e salvo no Firestore!');
            } catch (error) {
                console.error('Erro ao exportar backup:', error);
                alert('Erro ao exportar backup: ' + error.message);
            }
        }

        // Importar backup (agora com opção de restaurar do Firestore)
        async function importBackup(file, isFirestoreBackup = false, backupId = null) {
            try {
                let backupData;
                
                if (isFirestoreBackup && backupId) {
                    // Restaurar do Firestore
                    const success = await restoreFromBackup(backupId);
                    if (success) {
                        initDashboard();
                        alert('Backup do Firestore restaurado com sucesso!');
                        return;
                    } else {
                        throw new Error('Falha ao restaurar backup do Firestore');
                    }
                } else {
                    // Restaurar de arquivo local
                    const reader = new FileReader();
                    
                    return new Promise((resolve, reject) => {
                        reader.onload = async function(e) {
                            try {
                                backupData = JSON.parse(e.target.result);
                                
                                // Validação básica do backup
                                if (!backupData.unidades || !backupData.meses) {
                                    throw new Error('Arquivo de backup inválido');
                                }
                                
                                appData = backupData;
                                await saveData(); // Salva em ambos (local + Firestore)
                                initDashboard();
                                alert('Backup importado com sucesso!');
                                resolve(true);
                            } catch (error) {
                                console.error('Erro ao importar backup:', error);
                                alert('Erro ao importar backup: ' + error.message);
                                reject(error);
                            }
                        };
                        reader.onerror = function() {
                            alert('Erro ao ler o arquivo de backup');
                            reject(new Error('Erro ao ler arquivo'));
                        };
                        reader.readAsText(file);
                    });
                }
            } catch (error) {
                console.error('Erro no processo de importação:', error);
                alert('Erro no processo de importação: ' + error.message);
            }
        }

        // Processar dados do CSV e salvar no Firestore
        async function processCSVData(csvContent, unitName, month) {
            try {
                const lines = csvContent.split('\n');
                let currentUnit = null;
                
                // Encontrar a unidade ou criar uma nova
                currentUnit = appData.unidades.find(u => u.nome === unitName);
                if (!currentUnit) {
                    currentUnit = {
                        id: Date.now().toString(),
                        nome: unitName,
                        tipo: unitName.includes("UBS") ? "UBS" : 
                              unitName.includes("Cais") ? "CAIS" : "DEMAIS",
                        meses: {},
                        firestoreId: null
                    };
                    appData.unidades.push(currentUnit);
                }
                
                // Inicializar dados do mês se necessário
                if (!currentUnit.meses[month]) {
                    currentUnit.meses[month] = {
                        produtos: {},
                        sugestoes: [],
                        dataImportacao: new Date().toISOString()
                    };
                }
                
                const monthData = currentUnit.meses[month];
                
                // Processar linhas do CSV
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    
                    // Processar linhas de produtos (começam com números)
                    if (/^\d+,/.test(line)) {
                        const parts = line.split(',').map(part => part.trim().replace(/"/g, ''));
                        if (parts.length >= 3) {
                            const productName = parts[1];
                            const quantityAvailable = parseInt(parts[2]) || 0;
                            const minSuggested = parseInt(parts[3]) || 0;
                            
                            // Determinar status baseado na quantidade disponível vs mínima sugerida
                            let status = "ok";
                            if (quantityAvailable === 0) {
                                status = "danger";
                            } else if (quantityAvailable < minSuggested) {
                                status = "warning";
                            }
                            
                            // Adicionar produto à unidade
                            monthData.produtos[productName] = {
                                current: quantityAvailable,
                                min: minSuggested,
                                status: status
                            };
                        }
                    }
                    
                    // Processar sugestões (coluna "ESPAÇO PARA SUGESTÕES")
                    if (line.includes('ESPAÇO PARA SUGESTÕES') || (i > 0 && line.includes('"'))) {
                        const parts = line.split(',').map(part => part.trim().replace(/"/g, ''));
                        if (parts.length > 7 && parts[7]) {
                            const sugestao = parts[7];
                            if (sugestao && !sugestao.includes('ESPAÇO PARA SUGESTÕES')) {
                                // Verificar se a sugestão já existe para evitar duplicatas
                                const exists = monthData.sugestoes.some(s => s.texto === sugestao);
                                if (!exists) {
                                    monthData.sugestoes.push({
                                        id: monthData.sugestoes.length + 1,
                                        texto: sugestao,
                                        data: new Date().toISOString(),
                                        produto: parts[1] ? parts[1] : 'Geral'
                                    });
                                }
                            }
                        }
                    }
                }
                
                // Salvar no Firestore
                await saveData();
                
                return currentUnit;
            } catch (error) {
                console.error('Erro ao processar CSV:', error);
                throw error;
            }
        }

        // ========== NOVAS FUNÇÕES DE INTERFACE ==========

        // Mostrar modal de gerenciamento de backups
        function showBackupManager() {
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.5);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 1000;
            `;
            
            modal.innerHTML = `
                <div style="background: white; padding: 2rem; border-radius: 8px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto;">
                    <h2 style="margin-bottom: 1rem;">Gerenciar Backups</h2>
                    <div id="backupsList" style="margin-bottom: 1rem; max-height: 300px; overflow-y: auto;">
                        <p>Carregando backups...</p>
                    </div>
                    <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                        <button onclick="this.closest('div').parentElement.remove()" style="padding: 0.5rem 1rem; background: #6c757d; color: white; border: none; border-radius: 4px;">Fechar</button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            
            // Carregar lista de backups
            loadBackupsList();
        }

        // Carregar lista de backups na interface
        async function loadBackupsList() {
            const backupsList = document.getElementById('backupsList');
            backupsList.innerHTML = '<p>Carregando backups...</p>';
            
            try {
                const backups = await listBackups();
                
                if (backups.length === 0) {
                    backupsList.innerHTML = '<p>Nenhum backup encontrado no Firestore.</p>';
                    return;
                }
                
                let html = '<div style="display: flex; flex-direction: column; gap: 0.5rem;">';
                backups.forEach(backup => {
                    const date = new Date(backup.backupTimestamp).toLocaleString('pt-BR');
                    html += `
                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.5rem; background: #f8f9fa; border-radius: 4px;">
                            <div>
                                <strong>${backup.id}</strong>
                                <div style="font-size: 0.8rem; color: #6c757d;">${date}</div>
                            </div>
                            <button onclick="restoreBackupFromUI('${backup.id}')" style="padding: 0.25rem 0.5rem; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 0.8rem;">
                                Restaurar
                            </button>
                        </div>
                    `;
                });
                html += '</div>';
                
                backupsList.innerHTML = html;
            } catch (error) {
                backupsList.innerHTML = '<p>Erro ao carregar backups: ' + error.message + '</p>';
            }
        }

        // Restaurar backup a partir da UI
        async function restoreBackupFromUI(backupId) {
            if (confirm('Tem certeza que deseja restaurar este backup? Todos os dados atuais serão substituídos.')) {
                toggleLoading(true);
                try {
                    await importBackup(null, true, backupId);
                } catch (error) {
                    alert('Erro ao restaurar backup: ' + error.message);
                } finally {
                    toggleLoading(false);
                }
            }
        }

        // ========== INICIALIZAÇÃO ==========

        // Inicializar o dashboard
        async function initDashboard() {
            toggleLoading(true);
            
            try {
                // Configurar autenticação anônima
                await auth.signInAnonymously();
                
                // Carregar dados
                await loadData();
                
                // Configurar sincronização em tempo real
                setupRealtimeSync();
                
                // Configurar interface
                updateMonthSelectors();
                setupEventListeners();
                updateEmptyStates();
                updateManageUnitsTabVisibility();
                
                if (hasData()) {
                    updateDashboard();
                }
            } catch (error) {
                console.error('Erro na inicialização:', error);
            } finally {
                toggleLoading(false);
            }
        }

        // ========== FUNÇÕES EXISTENTES (MANTIDAS) ==========

        // Suas funções existentes aqui (toggleLoading, updateMonthSelectors, setupEventListeners, 
        // updateEmptyStates, updateManageUnitsTabVisibility, hasData, updateDashboard, etc.)
        // ... todas as suas funções existentes permanecem aqui ...

        function toggleLoading(show) {
            const loading = document.getElementById('loading');
            const mainContent = document.getElementById('main-content');
            
            if (show) {
                loading.style.display = 'block';
                mainContent.style.display = 'none';
            } else {
                loading.style.display = 'none';
                mainContent.style.display = 'block';
            }
        }

        function updateMonthSelectors() {
            // Sua implementação existente
        }

        function setupEventListeners() {
            // Sua implementação existente, com adições:
            
            // Botão para gerenciar backups
            const backupManagerBtn = document.createElement('button');
            backupManagerBtn.innerHTML = '<i class="fas fa-database"></i> Gerenciar Backups';
            backupManagerBtn.className = 'export-btn';
            backupManagerBtn.style.marginLeft = '1rem';
            backupManagerBtn.onclick = showBackupManager;
            
            // Adicionar ao painel administrativo
            const adminBackupSection = document.querySelector('#adminBackup .controls');
            if (adminBackupSection) {
                adminBackupSection.appendChild(backupManagerBtn);
            }
            
            // Seus outros event listeners existentes...
        }

        function updateEmptyStates() {
            // Sua implementação existente
        }

        function updateManageUnitsTabVisibility() {
            // Sua implementação existente
        }

        function hasData() {
            return appData.unidades.length > 0;
        }

        function updateDashboard() {
            // Sua implementação existente
        }

        // ... todas as suas outras funções existentes ...

        // Inicializar quando a página carregar
        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
