<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Completo - Materiais de Limpeza SMS</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <!-- Firebase Firestore -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ... (seus estilos CSS existentes permanecem os mesmos) ... */
        
        .firebase-status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .firebase-connected {
            background: var(--success-light);
            color: var(--success-dark);
            border: 1px solid var(--success-dark);
        }
        
        .firebase-disconnected {
            background: var(--danger);
            color: white;
            border: 1px solid var(--danger-dark);
        }
        
        .firebase-syncing {
            background: var(--warning);
            color: var(--dark);
            border: 1px solid var(--warning-dark);
        }
    </style>
</head>
<body>
    <div class="firebase-status" id="firebaseStatus" style="display: none;">
        <i class="fas fa-cloud"></i>
        <span id="firebaseStatusText">Conectando...</span>
    </div>

    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <p>Carregando dados...</p>
    </div>

    <div class="container" id="main-content">
        <!-- ... (seu HTML existente permanece o mesmo) ... -->
    </div>

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCFeYDNbXWNXSBPedaOXfSnDmlLh8Xtn9I",
            authDomain: "materiais-aeb0e.firebaseapp.com",
            projectId: "materiais-aeb0e",
            storageBucket: "materiais-aeb0e.firebasestorage.app",
            messagingSenderId: "78482972694",
            appId: "1:78482972694:web:659039bd4f6ba8689e1537",
            measurementId: "G-70BPGLZ63L"
        };

        // Inicializar Firebase
        let db = null;
        let firebaseInitialized = false;

        function initializeFirebase() {
            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                firebaseInitialized = true;
                updateFirebaseStatus('connected', 'Conectado ao Firebase');
                console.log('Firebase inicializado com sucesso');
                
                // Configurar listener para mudanças online/offline
                firebase.firestore().enablePersistence()
                    .then(() => {
                        console.log('Persistência ativada');
                    })
                    .catch((err) => {
                        console.log('Persistência não suportada:', err);
                    });
                    
            } catch (error) {
                console.error('Erro ao inicializar Firebase:', error);
                updateFirebaseStatus('disconnected', 'Erro no Firebase');
                firebaseInitialized = false;
            }
        }

        // Atualizar status do Firebase na UI
        function updateFirebaseStatus(status, message) {
            const statusElement = document.getElementById('firebaseStatus');
            const statusText = document.getElementById('firebaseStatusText');
            
            statusElement.style.display = 'flex';
            statusText.textContent = message;
            
            statusElement.className = 'firebase-status';
            if (status === 'connected') {
                statusElement.classList.add('firebase-connected');
            } else if (status === 'disconnected') {
                statusElement.classList.add('firebase-disconnected');
            } else if (status === 'syncing') {
                statusElement.classList.add('firebase-syncing');
            }
        }

        // Estrutura de dados principal
        let appData = {
            unidades: [],
            meses: {},
            currentMonth: new Date().toISOString().slice(0, 7),
            lastUpdate: new Date().toISOString(),
            isAdmin: false,
            settings: {
                autoSave: true,
                backupEnabled: true
            }
        };

        // Salvar dados no Firebase
        async function saveToFirebase() {
            if (!firebaseInitialized || !db) {
                console.log('Firebase não inicializado, salvando apenas localmente');
                saveToLocalStorage();
                return false;
            }

            try {
                updateFirebaseStatus('syncing', 'Sincronizando...');
                
                const dataToSave = {
                    ...appData,
                    lastFirebaseSync: new Date().toISOString()
                };

                await db.collection('appData').doc('limpezaDashboard').set(dataToSave);
                
                updateFirebaseStatus('connected', 'Dados salvos na nuvem');
                console.log('Dados salvos no Firebase com sucesso');
                return true;
            } catch (error) {
                console.error('Erro ao salvar no Firebase:', error);
                updateFirebaseStatus('disconnected', 'Erro ao sincronizar');
                
                // Fallback para localStorage
                saveToLocalStorage();
                return false;
            }
        }

        // Carregar dados do Firebase
        async function loadFromFirebase() {
            if (!firebaseInitialized || !db) {
                console.log('Firebase não inicializado, carregando do localStorage');
                return loadFromLocalStorage();
            }

            try {
                updateFirebaseStatus('syncing', 'Carregando da nuvem...');
                
                const doc = await db.collection('appData').doc('limpezaDashboard').get();
                
                if (doc.exists) {
                    const firebaseData = doc.data();
                    appData = { ...appData, ...firebaseData };
                    
                    // Garantir que a estrutura de meses esteja correta
                    if (!appData.meses) appData.meses = {};
                    
                    // Garantir que todas as unidades tenham dados para o mês atual
                    appData.unidades.forEach(unidade => {
                        if (!unidade.meses) unidade.meses = {};
                        if (!unidade.meses[appData.currentMonth]) {
                            unidade.meses[appData.currentMonth] = {
                                produtos: {},
                                sugestoes: [],
                                dataImportacao: new Date().toISOString()
                            };
                        }
                    });
                    
                    updateFirebaseStatus('connected', 'Dados carregados da nuvem');
                    console.log('Dados carregados do Firebase:', appData);
                    return true;
                } else {
                    console.log('Nenhum dado encontrado no Firebase, carregando do localStorage');
                    updateFirebaseStatus('connected', 'Nenhum dado na nuvem');
                    return loadFromLocalStorage();
                }
            } catch (error) {
                console.error('Erro ao carregar do Firebase:', error);
                updateFirebaseStatus('disconnected', 'Erro ao carregar');
                return loadFromLocalStorage();
            }
        }

        // Salvar dados no localStorage (fallback)
        function saveToLocalStorage() {
            try {
                appData.lastUpdate = new Date().toISOString();
                localStorage.setItem('limpezaData', JSON.stringify(appData));
                console.log('Dados salvos localmente');
            } catch (e) {
                console.error('Erro ao salvar dados localmente:', e);
            }
        }

        // Carregar dados do localStorage (fallback)
        function loadFromLocalStorage() {
            const saved = localStorage.getItem('limpezaData');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    appData = { ...appData, ...parsed };
                    
                    if (!appData.meses) appData.meses = {};
                    
                    appData.unidades.forEach(unidade => {
                        if (!unidade.meses) unidade.meses = {};
                        if (!unidade.meses[appData.currentMonth]) {
                            unidade.meses[appData.currentMonth] = {
                                produtos: {},
                                sugestoes: [],
                                dataImportacao: new Date().toISOString()
                            };
                        }
                    });
                    
                    console.log('Dados carregados localmente:', appData);
                    return true;
                } catch (e) {
                    console.error('Erro ao carregar dados locais:', e);
                    return false;
                }
            }
            return false;
        }

        // Função de salvamento automático
        function autoSave() {
            if (appData.settings.autoSave) {
                saveToFirebase().then(success => {
                    if (!success) {
                        console.log('Salvamento automático falhou, usando localStorage');
                    }
                });
            }
        }

        // Exportar backup completo - MELHORADO
        function exportCompleteBackup() {
            try {
                const backupData = {
                    unidades: appData.unidades,
                    meses: appData.meses,
                    currentMonth: appData.currentMonth,
                    lastUpdate: new Date().toISOString(),
                    backupVersion: '2.0',
                    firebaseSync: appData.lastFirebaseSync || 'Nunca sincronizado',
                    totalUnits: appData.unidades.length,
                    totalMonths: Object.keys(appData.meses).length,
                    exportDate: new Date().toISOString()
                };
                
                const dataStr = JSON.stringify(backupData, null, 2);
                const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
                
                const exportFileDefaultName = `backup_completo_limpeza_${new Date().toISOString().slice(0,10)}.json`;
                
                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri);
                linkElement.setAttribute('download', exportFileDefaultName);
                linkElement.click();
                
                // Registrar no histórico de backups
                addBackupToHistory('export', exportFileDefaultName);
                
                alert('Backup completo exportado com sucesso!');
                return true;
            } catch (error) {
                console.error('Erro ao exportar backup:', error);
                alert('Erro ao exportar backup: ' + error.message);
                return false;
            }
        }

        // Importar backup completo - MELHORADO
        function importCompleteBackup(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const backupData = JSON.parse(e.target.result);
                    
                    // Validação do backup
                    if (!backupData.unidades || !backupData.meses) {
                        throw new Error('Arquivo de backup inválido - estrutura incorreta');
                    }
                    
                    if (!confirm(`Deseja restaurar este backup?\n\nUnidades: ${backupData.unidades.length}\nMeses: ${Object.keys(backupData.meses).length}\nData: ${backupData.exportDate ? new Date(backupData.exportDate).toLocaleString('pt-BR') : 'Desconhecida'}`)) {
                        return;
                    }
                    
                    toggleLoading(true);
                    
                    setTimeout(() => {
                        appData = {
                            ...appData,
                            unidades: backupData.unidades,
                            meses: backupData.meses,
                            lastUpdate: new Date().toISOString()
                        };
                        
                        // Salvar no Firebase e localStorage
                        saveToFirebase().then(success => {
                            if (!success) {
                                saveToLocalStorage();
                            }
                            
                            // Registrar no histórico
                            addBackupToHistory('import', file.name);
                            
                            initDashboard();
                            alert('Backup importado com sucesso!');
                            toggleLoading(false);
                        });
                    }, 1000);
                    
                } catch (error) {
                    console.error('Erro ao importar backup:', error);
                    alert('Erro ao importar backup: ' + error.message);
                }
            };
            reader.onerror = function() {
                alert('Erro ao ler o arquivo de backup');
            };
            reader.readAsText(file);
        }

        // Histórico de backups
        function addBackupToHistory(type, filename) {
            if (!appData.backupHistory) {
                appData.backupHistory = [];
            }
            
            const backupRecord = {
                type: type, // 'export' ou 'import'
                filename: filename,
                date: new Date().toISOString(),
                dataSize: JSON.stringify(appData).length,
                unitsCount: appData.unidades.length
            };
            
            appData.backupHistory.unshift(backupRecord);
            
            // Manter apenas os últimos 10 registros
            if (appData.backupHistory.length > 10) {
                appData.backupHistory = appData.backupHistory.slice(0, 10);
            }
            
            autoSave();
        }

        // Exportar backup compacto (apenas dados essenciais)
        function exportCompactBackup() {
            try {
                // Criar backup apenas com dados essenciais
                const essentialData = {
                    unidades: appData.unidades.map(unit => ({
                        id: unit.id,
                        nome: unit.nome,
                        tipo: unit.tipo,
                        meses: unit.meses
                    })),
                    meses: appData.meses,
                    currentMonth: appData.currentMonth,
                    backupVersion: '2.0-compact',
                    exportDate: new Date().toISOString(),
                    totalUnits: appData.unidades.length
                };
                
                const dataStr = JSON.stringify(essentialData);
                const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
                
                const exportFileDefaultName = `backup_compacto_limpeza_${new Date().toISOString().slice(0,10)}.json`;
                
                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri);
                linkElement.setAttribute('download', exportFileDefaultName);
                linkElement.click();
                
                addBackupToHistory('export', exportFileDefaultName);
                
                alert('Backup compacto exportado com sucesso!');
                return true;
            } catch (error) {
                console.error('Erro ao exportar backup compacto:', error);
                alert('Erro ao exportar backup compacto: ' + error.message);
                return false;
            }
        }

        // Processar dados do CSV - ATUALIZADO com auto-save
        function processCSVData(csvContent, unitName, month) {
            const lines = csvContent.split('\n');
            let currentUnit = null;
            
            // Encontrar a unidade ou criar uma nova
            currentUnit = appData.unidades.find(u => u.nome === unitName);
            if (!currentUnit) {
                currentUnit = {
                    id: Date.now(),
                    nome: unitName,
                    tipo: unitName.includes("UBS") ? "UBS" : 
                          unitName.includes("Cais") ? "CAIS" : "DEMAIS",
                    meses: {}
                };
                appData.unidades.push(currentUnit);
            }
            
            // Inicializar dados do mês se necessário
            if (!currentUnit.meses[month]) {
                currentUnit.meses[month] = {
                    produtos: {},
                    sugestoes: [],
                    dataImportacao: new Date().toISOString()
                };
            }
            
            const monthData = currentUnit.meses[month];
            
            // Processar linhas do CSV
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                
                // Processar linhas de produtos (começam com números)
                if (/^\d+,/.test(line)) {
                    const parts = line.split(',').map(part => part.trim().replace(/"/g, ''));
                    if (parts.length >= 3) {
                        const productName = parts[1];
                        const quantityAvailable = parseInt(parts[2]) || 0;
                        const minSuggested = parseInt(parts[3]) || 0;
                        
                        // Determinar status baseado na quantidade disponível vs mínima sugerida
                        let status = "ok";
                        if (quantityAvailable === 0) {
                            status = "danger";
                        } else if (quantityAvailable < minSuggested) {
                            status = "warning";
                        }
                        
                        // Adicionar produto à unidade
                        monthData.produtos[productName] = {
                            current: quantityAvailable,
                            min: minSuggested,
                            status: status
                        };
                    }
                }
                
                // Processar sugestões (coluna "ESPAÇO PARA SUGESTÕES")
                if (line.includes('ESPAÇO PARA SUGESTÕES') || (i > 0 && line.includes('"'))) {
                    const parts = line.split(',').map(part => part.trim().replace(/"/g, ''));
                    if (parts.length > 7 && parts[7]) {
                        const sugestao = parts[7];
                        if (sugestao && !sugestao.includes('ESPAÇO PARA SUGESTÕES')) {
                            // Verificar se a sugestão já existe para evitar duplicatas
                            const exists = monthData.sugestoes.some(s => s.texto === sugestao);
                            if (!exists) {
                                monthData.sugestoes.push({
                                    id: monthData.sugestoes.length + 1,
                                    texto: sugestao,
                                    data: new Date().toISOString(),
                                    produto: parts[1] ? parts[1] : 'Geral'
                                });
                            }
                        }
                    }
                }
            }
            
            // Salvar automaticamente após processar CSV
            autoSave();
            
            return currentUnit;
        }

        // Adicionar nova sugestão - ATUALIZADO com auto-save
        function addNewSuggestion(suggestionText) {
            if (!suggestionText.trim()) {
                alert('Por favor, digite uma sugestão antes de enviar.');
                return;
            }
            
            // Encontrar a unidade atual (ou criar uma genérica)
            const currentMonth = document.getElementById('monthFilterSuggestions').value;
            let currentUnit = appData.unidades[0];
            
            if (!currentUnit) {
                currentUnit = {
                    id: Date.now(),
                    nome: 'Sugestão Geral',
                    tipo: 'DEMAIS',
                    meses: {}
                };
                appData.unidades.push(currentUnit);
            }
            
            if (!currentUnit.meses[currentMonth]) {
                currentUnit.meses[currentMonth] = {
                    produtos: {},
                    sugestoes: [],
                    dataImportacao: new Date().toISOString()
                };
            }
            
            currentUnit.meses[currentMonth].sugestoes.push({
                id: currentUnit.meses[currentMonth].sugestoes.length + 1,
                texto: suggestionText,
                data: new Date().toISOString(),
                produto: 'SUGESTÃO DE PRODUTO NÃO DISPONIBILIZADO E NECESSÁRIO'
            });
            
            // Salvar automaticamente
            autoSave();
            
            updateDashboard();
            document.getElementById('newSuggestion').value = '';
            alert('Sugestão enviada com sucesso!');
        }

        // Remover unidade - ATUALIZADO com auto-save
        function removeUnit(unitId) {
            if (confirm('Tem certeza que deseja remover esta unidade? Esta ação não pode ser desfeita.')) {
                appData.unidades = appData.unidades.filter(u => u.id != unitId);
                
                // Salvar automaticamente
                autoSave();
                
                updateEmptyStates();
                updateDashboard();
                alert('Unidade removida com sucesso!');
            }
        }

        // Inicializar o dashboard - ATUALIZADO com Firebase
        function initDashboard() {
            toggleLoading(true);
            
            // Inicializar Firebase primeiro
            initializeFirebase();
            
            setTimeout(async () => {
                // Carregar dados (tenta Firebase primeiro, depois localStorage)
                await loadFromFirebase();
                
                updateMonthSelectors();
                setupEventListeners();
                updateEmptyStates();
                updateManageUnitsTabVisibility();
                
                if (hasData()) {
                    updateDashboard();
                }
                
                toggleLoading(false);
                
                // Mostrar status do Firebase
                setTimeout(() => {
                    if (firebaseInitialized) {
                        updateFirebaseStatus('connected', 'Sincronizado com a nuvem');
                    }
                }, 2000);
            }, 1000);
        }

        // Configurar event listeners - ATUALIZADO com novas funcionalidades
        function setupEventListeners() {
            // ... (seus event listeners existentes) ...
            
            // Novos listeners para backup/restauração
            document.getElementById('exportBackupBtn').addEventListener('click', exportCompleteBackup);
            
            document.getElementById('importBackupBtn').addEventListener('click', () => {
                document.getElementById('backupFileInput').click();
            });
            
            document.getElementById('backupFileInput').addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    importCompleteBackup(e.target.files[0]);
                }
            });
            
            // Botão para backup compacto
            const compactBackupBtn = document.createElement('button');
            compactBackupBtn.className = 'export-btn warning';
            compactBackupBtn.innerHTML = '<i class="fas fa-compress"></i> Backup Compacto';
            compactBackupBtn.addEventListener('click', exportCompactBackup);
            
            // Adicionar botão à seção de backup
            const backupSection = document.querySelector('#adminBackup .controls');
            backupSection.appendChild(compactBackupBtn);
            
            // Sincronização manual
            const syncBtn = document.createElement('button');
            syncBtn.className = 'export-btn';
            syncBtn.innerHTML = '<i class="fas fa-sync"></i> Sincronizar Agora';
            syncBtn.addEventListener('click', () => {
                toggleLoading(true);
                saveToFirebase().then(success => {
                    toggleLoading(false);
                    if (success) {
                        alert('Dados sincronizados com sucesso!');
                    } else {
                        alert('Erro na sincronização. Verifique sua conexão.');
                    }
                });
            });
            
            backupSection.appendChild(syncBtn);
        }

        // Inicializar o dashboard quando a página carregar
        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
